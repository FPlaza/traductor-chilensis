[package]
name = "contexto"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "contexto"
path = "src/main.rs"

[dependencies]
# Web framework
actix-web = "4"
actix-cors = "0.7"

# gRPC
tonic = "0.10"
prost = "0.12"

# Base de datos con ORM
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "json"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
dotenv = "0.15"

[build-dependencies]
tonic-build = "0.10"
