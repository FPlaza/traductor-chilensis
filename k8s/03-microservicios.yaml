# ============================================
# API Gateway (NestJS + GraphQL)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: traductor-chilensis/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: TRADUCTOR_URL
              valueFrom:
                configMapKeyRef:
                  name: chilensis-config
                  key: TRADUCTOR_URL
            - name: SUGERENCIAS_URL
              valueFrom:
                configMapKeyRef:
                  name: chilensis-config
                  key: SUGERENCIAS_URL
            - name: CONTEXTO_URL
              valueFrom:
                configMapKeyRef:
                  name: chilensis-config
                  key: CONTEXTO_URL
          readinessProbe:
            httpGet:
              path: /graphql
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: chilensis
spec:
  selector:
    app: api-gateway
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000

