# ============================================
# Diccionario (Java + gRPC)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diccionario
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diccionario
  template:
    metadata:
      labels:
        app: diccionario
    spec:
      containers:
        - name: diccionario
          image: traductor-chilensis/diccionario:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
            - containerPort: 50051
          env:
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: chilensis-config
                  key: DB_HOST
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: chilensis-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chilensis-secrets
                  key: DB_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: diccionario-service
  namespace: chilensis
spec:
  selector:
    app: diccionario
  ports:
    - name: http
      port: 8081
      targetPort: 8081
    - name: grpc
      port: 50051
      targetPort: 50051

---
# ============================================
# Contexto (Rust + gRPC)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contexto
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contexto
  template:
    metadata:
      labels:
        app: contexto
    spec:
      containers:
        - name: contexto
          image: traductor-chilensis/contexto:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
            - containerPort: 50052
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chilensis-secrets
                  key: DATABASE_URL_CONTEXTO
            - name: PORT
              value: "8082"
            - name: GRPC_PORT
              value: "50052"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: contexto-service
  namespace: chilensis
spec:
  selector:
    app: contexto
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 50052
      targetPort: 50052

