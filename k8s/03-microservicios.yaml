# ============================================
# Diccionario (Java + REST)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diccionario
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diccionario
  template:
    metadata:
      labels:
        app: diccionario
    spec:
      containers:
        - name: diccionario
          image: traductor-chilensis-diccionario:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_USER
              value: "admin"
            - name: DB_PASSWORD
              value: "admin_password"

---
apiVersion: v1
kind: Service
metadata:
  name: diccionario-service
  namespace: chilensis
spec:
  selector:
    app: diccionario
  ports:
    - name: http
      port: 8081
      targetPort: 8081

---
# ============================================
# Contexto (Rust + gRPC)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: contexto
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: contexto
  template:
    metadata:
      labels:
        app: contexto
    spec:
      containers:
        - name: contexto
          image: traductor-chilensis-contexto:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
            - containerPort: 50052
          env:
            - name: DATABASE_URL
              value: "postgres://admin:admin_password@postgres-service:5432/db_contexto"
            - name: PORT
              value: "8082"
            - name: GRPC_PORT
              value: "50052"

---
apiVersion: v1
kind: Service
metadata:
  name: contexto-service
  namespace: chilensis
spec:
  selector:
    app: contexto
  ports:
    - name: http
      port: 8082
      targetPort: 8082
    - name: grpc
      port: 50052
      targetPort: 50052

---
# ============================================
# Traductor (Go)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traductor
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traductor
  template:
    metadata:
      labels:
        app: traductor
    spec:
      containers:
        - name: traductor
          image: traductor-chilensis-traductor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgres://admin:admin_password@postgres-service:5432/db_traductor"
            - name: DICCIONARIO_ADDR
              value: "diccionario-service:8081"
            - name: NATS_URL
              value: "nats://nats-service:4222"
            - name: PORT
              value: "8080"

---
apiVersion: v1
kind: Service
metadata:
  name: traductor-service
  namespace: chilensis
spec:
  selector:
    app: traductor
  ports:
    - port: 8080
      targetPort: 8080

---
# ============================================
# Sugerencias (NestJS)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sugerencias
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sugerencias
  template:
    metadata:
      labels:
        app: sugerencias
    spec:
      containers:
        - name: sugerencias
          image: traductor-chilensis-sugerencias:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
          env:
            - name: DATABASE_URL
              value: "postgres://admin:admin_password@postgres-service:5432/db_sugerencias"
            - name: NATS_URL
              value: "nats://nats-service:4222"
            - name: PORT
              value: "3001"

---
apiVersion: v1
kind: Service
metadata:
  name: sugerencias-service
  namespace: chilensis
spec:
  selector:
    app: sugerencias
  ports:
    - port: 3001
      targetPort: 3001

---
# ============================================
# API Gateway (NestJS + GraphQL)
# ============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: chilensis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: traductor-chilensis-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: TRADUCTOR_URL
              value: "http://traductor-service:8080"
            - name: SUGERENCIAS_URL
              value: "http://sugerencias-service:3001"
            - name: CONTEXTO_URL
              value: "http://contexto-service:8082"
            - name: PORT
              value: "3000"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: chilensis
spec:
  selector:
    app: api-gateway
  type: NodePort
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30000

---
# ============================================
# Frontend (React) - Sin VITE_GRAPHQL_URL fija
# Ver README para instrucciones de build
# ============================================
